version: '3.9'

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cad
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/cad
      PORT: 3333
      JWT_ACCESS_SECRET: change-me-access
      JWT_REFRESH_SECRET: change-me-refresh
      WEB_ORIGIN: http://localhost:4173
      HMAC_SECRET: change-me-hmac
      FEATURE_FIVEM: 'true'
      CSRF_PROTECTION: 'false'
    ports:
      - '3333:3333'
    depends_on:
      - db

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_URL: http://api:3333/api
      VITE_SOCKET_URL: http://api:3333
    ports:
      - '4173:4173'
    depends_on:
      - api

volumes:
  postgres-data:
